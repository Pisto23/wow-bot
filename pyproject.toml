[project]
name = "wowhelper"
version = "0.1.0"
description = "Dagor Raidbot — Discord-Bot mit wowaudit-Anbindung (Raid-Anmeldung, Wishlist-Upload, Charakter-Verlinkung)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "discord.py>=2.7,<3",
    "aiohttp>=3.9",
    "aiosqlite>=0.20",
    "PyYAML>=6",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wowhelper"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
